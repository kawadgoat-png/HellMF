<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HFM</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');


*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;

}


html,body{

    width:100%;
    height:100%;
    overflow:hidden;

}


body{

    background:
    radial-gradient(
        circle at center,
        #550000 0%,
        #220000 40%,
        #050000 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Cinzel',serif;

    transition:background 8s ease;

}



/* =========================
        LUEUR ROUGE
========================= */


body::before{

    content:"";

    position:absolute;

    width:900px;
    height:900px;

    background:#900000;

    filter:blur(220px);

    opacity:.25;

    animation:darkPulse 7s infinite alternate;

}



@keyframes darkPulse{


from{

    transform:scale(1);

    opacity:.18;

}


to{

    transform:scale(1.4);

    opacity:.45;

}


}





/* =========================
        HFM
========================= */


#logo{

    position:absolute;

    top:35px;

    color:#020202;

    font-size:65px;

    font-weight:700;

    letter-spacing:30px;

    text-shadow:

    0 0 20px #700000;


    z-index:5;

}




/* =========================
        CENDRES
========================= */


.ash{

    position:absolute;

    width:4px;

    height:4px;

    background:#888;

    border-radius:50%;

    opacity:.5;

    animation:fall linear infinite;

}



@keyframes fall{


from{

    transform:
    translateY(-20vh)
    rotate(0deg);

}


to{

    transform:
    translateY(120vh)
    rotate(360deg);

}


}






/* =========================
        CONTENEUR
========================= */


.box{


    position:relative;

    z-index:3;


    width:470px;


    padding:50px;


    background:#050505;


    border:1px solid #700000;


    box-shadow:

    0 0 60px #550000,

    inset 0 0 40px #250000;


    text-align:center;


}





/* =========================
        INPUT
========================= */


input{


    width:100%;


    height:60px;


    background:#111;


    border:1px solid #800000;


    color:#990000;


    font-size:18px;


    text-align:center;


    outline:none;


}



input:focus{


    box-shadow:

    0 0 30px #900000;


}





/* =========================
        BOUTON
========================= */


button{


    margin-top:25px;


    width:100%;


    height:55px;


    background:#300000;


    border:none;


    color:#a00000;


    font-size:18px;


    font-family:'Cinzel',serif;


    cursor:pointer;


    transition:.3s;


}




button:hover{


    background:#600000;


    color:white;


}




/* =========================
        ERREUR
========================= */


#error{

    margin-top:20px;

    color:#900000;

    min-height:25px;

    font-size:15px;

}




/* =========================
        TREMBLEMENT
========================= */


.shake{


    animation:shake .18s;


}



@keyframes shake{


0%{

    transform:translateX(0);

}


25%{

    transform:translateX(-10px);

}


50%{

    transform:translateX(10px);

}


75%{

    transform:translateX(-6px);

}


100%{

    transform:translateX(0);

}


}







/* =========================
        TRANSITION BLANCHE
========================= */


#transition{


    position:fixed;


    inset:0;


    background:white;


    opacity:0;


    pointer-events:none;


    z-index:20;


    transition:opacity 8s ease;


}







/* =========================
        FORMES NOIRES
========================= */


.geometry{


    position:fixed;


    background:black;


    opacity:.75;


    z-index:25;


    animation:shrinkFade linear forwards;


}



@keyframes shrinkFade{


0%{


    transform:scale(1);


    opacity:.8;


}



100%{


    transform:scale(0);


    opacity:0;


}


}







/* =========================
        MESSAGE FINAL
========================= */


.final{


    position:fixed;


    inset:0;


    background:white;


    color:black;


    display:flex;


    justify-content:center;


    align-items:center;


    flex-direction:column;


    text-align:center;


    z-index:30;


    opacity:0;


    animation:appear 5s forwards;


}



.final p{


    max-width:950px;


    font-size:22px;


    line-height:2;


    letter-spacing:1px;


    padding:40px;


}



.final h1{


    font-size:38px;


    margin-bottom:30px;


    letter-spacing:8px;


}





@keyframes appear{


from{


    opacity:0;


    filter:blur(15px);


}



to{


    opacity:1;


    filter:blur(0);


}


}






/* =========================
        AUDIO BUTTON CACHE
========================= */


#sound{


    display:none;


}



</style>

</head>



<body>


<div id="logo">
HFM
</div>



<div id="transition"></div>



<div class="box" id="box">


<input

id="code"

type="password"

placeholder="Enter the truth...">


<button onclick="verify()">

ENTER

</button>



<div id="error"></div>


</div>
<script>


/* =========================
        CREATION CENDRES
========================= */


for(let i = 0; i < 120; i++){


    let ash = document.createElement("div");


    ash.className="ash";


    ash.style.left =
    Math.random()*100 + "%";


    ash.style.top =
    Math.random()*-100 + "vh";


    ash.style.animationDuration =
    (5 + Math.random()*12) + "s";


    ash.style.animationDelay =
    Math.random()*10 + "s";


    ash.style.opacity =
    Math.random();


    document.body.appendChild(ash);


}






/* =========================
        TREMBLEMENT
========================= */


function shake(){


    document.body.classList.remove("shake");


    void document.body.offsetWidth;


    document.body.classList.add("shake");


}






/* =========================
        VERIFICATION WORKER
========================= */


async function verify(){


    shake();


    let code =
    document.getElementById("code").value;



    try{


        const response = await fetch(

        "https://hfm-verification.kawadgoat.workers.dev/",

        {

            method:"POST",


            headers:{

                "Content-Type":"application/json"

            },


            body:JSON.stringify({

                code:code

            })

        });



        const data =
        await response.json();



        if(data.success){


            openGate(data.message);


        }


        else{


            document.getElementById("error").innerHTML =

            "The gate remains closed.";


        }



    }


    catch(error){


        document.getElementById("error").innerHTML =

        "Connection error.";


        console.log(error);


    }



}








/* =========================
        OUVERTURE FINALE
========================= */


function openGate(message){



    let transition =

    document.getElementById("transition");



    transition.style.opacity="1";




    setTimeout(()=>{



        document.body.style.background="white";



        document.getElementById("box").style.display="none";


        document.getElementById("logo").style.display="none";



        transition.style.display="none";





        /* FORMES GEOMETRIQUES */


        for(let i=0;i<45;i++){



            let shape =
            document.createElement("div");



            shape.className="geometry";



            let size =
            Math.random()*100+20;



            shape.style.width =
            size+"px";



            shape.style.height =
            size+"px";



            shape.style.left =
            Math.random()*100+"%";



            shape.style.top =
            Math.random()*100+"%";



            if(Math.random()>0.5){


                shape.style.borderRadius="50%";


            }



            shape.style.animationDuration =

            (3+Math.random()*7)+"s";



            document.body.appendChild(shape);



            setTimeout(()=>{


                shape.remove();


            },9000);



        }






        /* MESSAGE FINAL */


        let final =
        document.createElement("div");



        final.className="final";



        final.innerHTML=`

        <h1>HFM</h1>


        <p>

        Lost beneath the forgotten floors.<br><br>

        Every voice slowly disappeared.<br><br>

        The last record was never found.<br><br>

        Hidden inside the silence.<br><br>

        -nixao is listening<br><br>

        Another message remains.<br><br>

        Remember the name.<br><br>

        Gone before the ending.<br><br><br>


        A channel needs a door before the name.<br><br>

        Find the door that every video uses.

        </p>

        `;



        document.body.appendChild(final);




    },8000);



}



</script>


</body>

</html>
