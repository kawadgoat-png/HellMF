<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HFM</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');


*{

margin:0;
padding:0;
box-sizing:border-box;
user-select:none;

}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at center,
#520000 0%,
#200000 40%,
#050000 100%);

display:flex;
justify-content:center;
align-items:center;

font-family:Cinzel,serif;

transition:background 3s;

}



/* Lueur rouge */

body::before{

content:"";

position:absolute;

width:800px;
height:800px;

background:#a00000;

filter:blur(200px);

opacity:.25;

animation:pulse 6s infinite alternate;

}



@keyframes pulse{

from{

transform:scale(1);

opacity:.2;

}


to{

transform:scale(1.4);

opacity:.45;

}

}



/* HFM */

#logo{

position:absolute;

top:35px;

color:#030303;

font-size:60px;

letter-spacing:25px;

text-shadow:

0 0 15px #700000;

z-index:5;

}



/* Cendres */

.ash{

position:absolute;

background:#888;

width:4px;
height:4px;

border-radius:50%;

opacity:.6;

animation:fall linear infinite;

}



@keyframes fall{


from{

transform:translateY(-20vh);

}


to{

transform:translateY(120vh);

}


}



/* Bloc */

.box{

position:relative;

z-index:2;

width:460px;

padding:45px;

background:#050505;

border:

1px solid #700000;


box-shadow:

0 0 50px #500000,

inset 0 0 30px #300000;


text-align:center;

}



/* Entrée */

input{


width:100%;

height:55px;

background:#111;

border:1px solid #800000;

color:#900000;

text-align:center;

font-size:18px;

outline:none;

}



input:focus{

box-shadow:0 0 25px #900000;

}



/* Bouton */

button{

margin-top:20px;

width:100%;

height:55px;

background:#300000;

border:none;

color:#a00000;

font-size:18px;

cursor:pointer;

transition:.3s;

}



button:hover{

background:#600000;

color:white;

}



/* Message erreur */

#error{

margin-top:15px;

color:#900000;

}



/* Tremblement */

.shake{

animation:shake .2s;

}



@keyframes shake{


0%{
transform:translateX(0);
}


25%{
transform:translateX(-10px);
}


50%{
transform:translateX(10px);
}


75%{
transform:translateX(-5px);
}


100%{
transform:translateX(0);
}


}



/* Transition blanche */

#transition{

position:fixed;

inset:0;

background:white;

opacity:0;

pointer-events:none;

z-index:20;

transition:opacity 3s;

}



</style>

</head>


<body>


<div id="logo">
HFM
</div>


<div id="transition"></div>


<div class="box" id="box">


<input
id="code"
type="password"
placeholder="Enter the truth...">


<button onclick="verify()">

ENTER

</button>


<div id="error"></div>


</div>
<script>


/* Création des cendres */

for(let i = 0; i < 100; i++){

    let ash = document.createElement("div");

    ash.className = "ash";


    ash.style.left = Math.random()*100 + "%";

    ash.style.animationDuration =
    (5 + Math.random()*12) + "s";


    ash.style.animationDelay =
    Math.random()*10 + "s";


    ash.style.opacity =
    Math.random();


    document.body.appendChild(ash);

}



/* Tremblement */

function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

}



/* Vérification */

async function verify(){


    shake();


    let code =
    document.getElementById("code").value;



    try{


        const response = await fetch(

        "https://hfm-verification.kawadgoat.workers.dev/",

        {

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },


            body:JSON.stringify({

                code:code

            })

        });



        const data =
        await response.json();



        if(data.success){


            openGate(data.message);


        }

        else{


            document.getElementById("error").innerHTML =
            "The gate remains closed.";


        }



    }


    catch(error){


        document.getElementById("error").innerHTML =
        "Connection error.";


        console.log(error);


    }



}




/* Ouverture */

function openGate(message){


    document.getElementById("transition").style.opacity="1";


    setTimeout(()=>{


        document.body.style.background="white";


        document.getElementById("box").style.display="none";


        document.getElementById("logo").style.display="none";



        document.getElementById("transition").style.opacity="0";



        let final=document.createElement("div");


        final.style.position="fixed";

        final.style.inset="0";

        final.style.background="white";

        final.style.color="black";

        final.style.display="flex";

        final.style.flexDirection="column";

        final.style.justifyContent="center";

        final.style.alignItems="center";

        final.style.textAlign="center";

        final.style.fontFamily="Cinzel,serif";



        final.innerHTML=`

        <h1 style="font-size:38px;margin-bottom:25px;">
        The gate has opened.
        </h1>

        <p style="font-size:22px;">
        ${message}
        </p>

        `;



        document.body.appendChild(final);



    },3000);



}


</script>


</body>

</html>
